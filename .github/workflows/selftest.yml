name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for selftest
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Run selftest
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/selftest.py

  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check SKILL.md frontmatter
        run: |
          python - <<'EOF'
          import re, sys
          text = open("SKILL.md", encoding="utf-8").read()
          m = re.match(r"---\n(.*?)\n---\n", text, re.S)
          assert m, "missing frontmatter"
          fm = m.group(1)
          name = re.search(r"^name: (.+)$", fm, re.M).group(1).strip()
          desc = re.search(r"^description: (.+)$", fm, re.M).group(1).strip()
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) and len(name) <= 64, name
          # 500: DeepSeek Harness truncates catalog descriptions there; the spec allows 1024
          assert len(desc) <= 500, f"description is {len(desc)} chars"
          print(f"ok: name={name}, description={len(desc)} chars")
          EOF
